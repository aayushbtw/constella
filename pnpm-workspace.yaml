packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
minimumReleaseAgeExclude:
  - "@tanstack/intent@0.5.5"
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
  - "@base-ui/react@1.9.0"
  - "@base-ui/utils@0.5.0"
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
overrides:
  vite@*: "catalog:"
# Input registered a commit before its Choices, which loops hydration on React 19.3; drop once shadcn ships the fix.
patchedDependencies:
  "@shadcn/react@0.3.1": patches/@shadcn__react@0.3.1.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
